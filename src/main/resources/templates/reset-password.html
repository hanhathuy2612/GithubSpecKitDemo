<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Set new password</title>
</head>
<body>
<main>
    <h1>Set a new password</h1>
    <ul th:if="${errors}" role="alert">
        <li th:each="error : ${errors}" th:text="${error}">error</li>
    </ul>
    <form method="post" th:action="@{/reset-password}" th:object="${form}">
        <input type="hidden" name="token" th:value="*{token}">
        <label for="newPassword">New password (8–64 characters)</label>
        <input id="newPassword" type="password" name="newPassword" required minlength="8" maxlength="64"
               autocomplete="new-password">
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" name="confirmPassword" required minlength="8" maxlength="64"
               autocomplete="new-password">
        <button type="submit">Reset password</button>
    </form>
</main>
</body>
</html>
