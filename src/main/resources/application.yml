spring:
  application:
    name: reset-password-demo
  datasource:
    url: jdbc:h2:file:./data/resetpassword
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}

server:
  forward-headers-strategy: none
  tomcat:
    accesslog:
      enabled: false

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail-from: ${APP_MAIL_FROM:no-reply@example.com}
  mail-async: true
  jwt:
    issuer: reset-password-demo
    private-key: ${APP_JWT_PRIVATE_KEY:}
    public-key: ${APP_JWT_PUBLIC_KEY:}
    key-id: ${APP_JWT_KEY_ID:dev}
