<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password</title>
</head>
<body>
<main>
    <h1>Forgot password</h1>
    <p th:if="${confirmation}" role="status" th:text="${confirmation}">confirmation</p>
    <form method="post" th:action="@{/forgot-password}" th:object="${form}">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" th:value="*{email}" required maxlength="254" autocomplete="email">
        <p th:if="${emailError}" role="alert" th:text="${emailError}">error</p>
        <button type="submit">Send reset link</button>
    </form>
</main>
</body>
</html>
